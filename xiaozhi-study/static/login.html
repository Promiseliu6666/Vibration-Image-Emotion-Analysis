<!doctype html><html lang="zh-CN"><head><style>html{visibility:hidden}</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小智伴学</title><link rel="stylesheet" href="console.css?v=21"><link rel="stylesheet" href="login-scene.css?v=1"></head><body class="login-layout login-cinematic"><div class="login-landscape" aria-hidden="true"></div><section class="login-story"><div class="brand"><span class="brand-mark"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="4"/><circle cx="12" cy="12" r="3.5"/><path d="M18 8h.01"/></svg></span><div>小智伴学<small>陪伴每一段书桌时光</small></div></div><h1>把专注留给书桌，<br>把安心留给家人。</h1><p>连接小智，查看实时状态，回看健康与学习节律。</p><div class="story-foot">实时画面 · 用眼与久坐提醒 · 健康记录</div></section><section class="login-main"><div class="login-box"><div class="login-symbol" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17H5zM9 4V2m6 2V2M8 9h8M8 13h8M8 17h5"/></svg></div><h2>登录居家实时监测</h2><p>继续查看你的设备与健康记录。</p><form id="loginForm"><div class="field"><label for="username">用户名</label><input id="username" autocomplete="username" required autofocus placeholder="输入用户名"></div><div class="field"><label for="password">密码</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="输入密码"><button id="togglePassword" type="button" aria-label="显示密码" aria-pressed="false">显示</button></div></div><p id="errorMsg" class="error-text" role="alert"></p><button id="loginButton" class="primary">进入工作台</button></form></div></section><script>
async function initializeLogin(){
 const token=localStorage.getItem('token');
 if(token){
  try{const r=await fetch('/api/devices',{headers:{Authorization:'Bearer '+token},cache:'no-store',signal:AbortSignal.timeout(8000)});
   if(r.ok){location.replace('/static/dashboard.html?v=21');return}
   if(r.status===401||r.status===403)localStorage.removeItem('token');
  }catch(e){document.getElementById('errorMsg').textContent='暂时无法连接后台，请确认项目已启动。'}
 }
 document.documentElement.style.visibility='visible';
}
initializeLogin();
const pass=document.getElementById('password'),toggle=document.getElementById('togglePassword');toggle.onclick=()=>{const show=pass.type==='password';pass.type=show?'text':'password';toggle.textContent=show?'隐藏':'显示';toggle.setAttribute('aria-label',show?'隐藏密码':'显示密码');toggle.setAttribute('aria-pressed',String(show))};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('loginButton'),error=document.getElementById('errorMsg');b.disabled=true;b.textContent='正在登录…';error.textContent='';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch('/api/login',{method:'POST',signal:controller.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value.trim(),password:pass.value})});if(!r.ok)throw Error(r.status===401?'用户名或密码不正确，请重新输入。':'服务暂时不可用，请稍后重试。');const d=await r.json();localStorage.setItem('token',d.access_token);location.replace('/static/dashboard.html?v=21')}catch(e){error.textContent=e.name==='AbortError'?'连接超时，请确认项目已启动。':e.message==='Failed to fetch'?'无法连接后台，请确认项目已启动。':e.message}finally{clearTimeout(timer);b.disabled=false;b.textContent='进入工作台'}};
</script><script src="login-scene.js?v=1"></script></body></html>
