[project]
name = "ruoyi-fastapi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.1",
    "apscheduler>=3.11.0",
    "asyncmy>=0.2.10",
    "bcrypt<5",
    "datetime>=5.5",
    "fastapi[all]>=0.115.8",
    "loguru>=0.7.3",
    "numpy>=2.3.3",
    "openpyxl>=3.1.5",
    "paddlepaddle==3.0.0",
    "paddlex[cv]>=3.2.1",
    "pandas>=2.2.3",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=11.1.0",
    "psutil>=7.0.0",
    "pydantic-validation-decorator>=0.1.4",
    "pyjwt[crypto]>=2.10.1",
    "pymysql>=1.1.1",
    "redis>=5.2.1",
    "reportlab>=4.5.1",
    "requests>=2.32.3",
    "sqlalchemy[asyncio]>=2.0.38",
    "sqlglot[rs]>=26.6.0",
    "user-agents>=2.2.0",
    "uvicorn>=0.38.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[dependency-groups]
dev = [
    "cython>=3.1.3",
    "ruff>=0.13.0",
]
